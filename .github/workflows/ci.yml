name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Format, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-scope: quality

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: ponto
          POSTGRES_DB: ponto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponto -d ponto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ponto:ponto@localhost:5432/ponto
      REDIS_URL: redis://localhost:6379
      WEB_APP_URL: http://localhost:3001
      SMTP_HOST: localhost
      EMAIL_FROM: Ponto <no-reply@ponto.test>

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-scope: test

      - name: Unit tests
        run: pnpm test

      - name: Migrations
        run: pnpm db:migrate

      - name: E2E tests
        run: pnpm test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_URL: http://localhost:3000
      EXPO_PUBLIC_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-scope: build

      - name: Build
        run: pnpm build
